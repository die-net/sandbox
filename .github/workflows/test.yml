name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    name: vet linux/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"

  # Each Ubuntu release a runner offers is named, rather than ubuntu-latest,
  # since their AppArmor policies differ. Both keep
  # kernel.apparmor_restrict_unprivileged_userns at 1, so bubblewrap can make a
  # user namespace only for a program with a profile that allows it.
  # scripts/apparmor.sh loads the profile the library prints for the test
  # binary, and removes it after. 26.04 also loads Ubuntu's
  # bwrap-userns-restrict, whose bwrap profile attaches to /usr/bin/bwrap and
  # takes the capabilities away from what bubblewrap starts, so the profile
  # printed there is the enforce-mode one (docs/linux.md). Its leg fails if
  # that profile isn't loaded, so CI keeps testing both profiles.
  test:
    name: test ${{ matrix.os }} cgo=${{ matrix.cgo }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        cgo: ["0", "1"]
        include:
          - os: ubuntu-26.04
            bwrap-profile: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      # TestIsolation's open level tries to replace an iptables table, and
      # wants the kernel's EPERM. Without the ip_tables module, which 26.04's
      # runner doesn't load, the kernel answers ENOPROTOOPT before it checks
      # anything, and the test would prove nothing.
      - name: Load ip_tables
        run: sudo modprobe ip_tables
      - name: Show the restriction
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
          ls /sys/kernel/security/apparmor/policy/profiles | grep -E 'bwrap|userns' || true
      - name: Require Ubuntu's bwrap profile
        if: matrix.bwrap-profile
        run: |
          if ! ls -d /sys/kernel/security/apparmor/policy/profiles/bwrap.* >/dev/null 2>&1; then
            echo "Ubuntu's bwrap profile is not loaded, so this leg would not test the enforce-mode profile" >&2
            exit 1
          fi
      # SBX_LOCAL runs the tests on this machine, as the runner's own user, in
      # a directory of their own under /tmp, as the script explains.
      - name: Test
        run: scripts/linux-test.sh -test.v -test.timeout=15m
        env:
          SBX_LOCAL: "1"
          SBX_APPARMOR: "1"
          CGO: ${{ matrix.cgo }}

  # The tests start real sandboxes with /usr/bin/sandbox-exec, as the runner's
  # own user, so they need no setup. A runner is not inside a Seatbelt profile,
  # which Probe would refuse. Firefox is on the runner image, so
  # TestFirefoxScreenshot and TestFirefoxNetwork run, and skip where it is not.
  # The race detector needs cgo on macOS, so only that leg runs it.
  #
  # Seatbelt's rules differ between releases: macOS 15 and 26 allowed a hard
  # link that 27 refuses (docs/findings.md). So each release a runner offers
  # is named here, rather than macos-latest, which moves without notice.
  macos:
    name: test ${{ matrix.os }} cgo=${{ matrix.cgo }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        cgo: ["0", "1"]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # The other architecture, which the runner cannot run but must build.
      - run: go vet ./...
        env:
          GOARCH: amd64
      - name: Test
        run: go test -v -count=1 -timeout 15m ./...
      - name: Test with the race detector
        if: matrix.cgo == '1'
        run: go test -race -count=1 -timeout 25m ./...
