name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    name: vet linux/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"

  test:
    name: test linux/amd64 cgo=${{ matrix.cgo }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cgo: ["0", "1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      # Ubuntu 24.04 sets kernel.apparmor_restrict_unprivileged_userns=1, so
      # bubblewrap can make a user namespace only for a program with an
      # AppArmor profile that allows it. scripts/apparmor.sh loads the profile
      # the library prints for the test binary, and removes it after.
      - name: Show the restriction
        run: sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
      # SBX_LOCAL runs the tests on this machine, as the runner's own user, in
      # a directory of their own under /tmp, as the script explains.
      - name: Test
        run: scripts/linux-test.sh -test.v -test.timeout=15m
        env:
          SBX_LOCAL: "1"
          SBX_APPARMOR: "1"
          CGO: ${{ matrix.cgo }}

  # The tests start real sandboxes with /usr/bin/sandbox-exec, as the runner's
  # own user, so they need no setup. A runner is not inside a Seatbelt profile,
  # which Probe would refuse. Firefox is on the runner image, so
  # TestFirefoxScreenshot and TestFirefoxNetwork run, and skip where it is not.
  # The race detector needs cgo on macOS, so only that leg runs it.
  macos:
    name: test macos cgo=${{ matrix.cgo }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        cgo: ["0", "1"]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # The other architecture, which the runner cannot run but must build.
      - run: go vet ./...
        env:
          GOARCH: amd64
      - name: Test
        run: go test -v -count=1 -timeout 15m ./...
      - name: Test with the race detector
        if: matrix.cgo == '1'
        run: go test -race -count=1 -timeout 25m ./...
