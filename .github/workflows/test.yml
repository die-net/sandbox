name: test

on:
  pull_request:
  # Only main runs on push. A branch with a pull request is tested by
  # pull_request, and a push there too would run every job twice. Main's
  # runs check what merged and save the caches that pull requests restore.
  push:
    branches: [main]

permissions:
  contents: read

# Each job builds with different settings, and builds with cgo, with -race,
# or for another GOOS or GOARCH share few compiled packages with one
# another. So each job keeps its own cache, named by its runner image and
# leg, rather than setup-go's, whose key is only the Go version and go.sum
# and so is shared by every job. A key is saved once and never updated, so
# it changes with go.mod, whose toolchain line picks the Go that builds
# everything. The cgo=1 legs' key holds the race-built standard library.
# macOS keeps the build cache in ~/Library/Caches/go-build.

jobs:
  # One job vets every target the library builds for. Each vet takes a few
  # seconds, and a job of its own spent most of its time setting up Go. A
  # target that fails doesn't stop the others.
  vet:
    name: vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-vet-${{ hashFiles('go.mod') }}
      - run: |
          status=0
          for target in linux/amd64 linux/arm64 linux/arm darwin/arm64 darwin/amd64 windows/amd64; do
            echo "::group::go vet $target"
            if ! GOOS=${target%/*} GOARCH=${target#*/} go vet ./...; then
              echo "::error::go vet failed for $target"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
        env:
          CGO_ENABLED: "0"

  # Ubuntu 26.04 also attaches an AppArmor profile to /usr/bin/bwrap that
  # denies capabilities to what bubblewrap starts, whatever the sysctl says,
  # which the library's profile undoes for the test binary (docs/linux.md).
  test:
    name: test ${{ matrix.os }} linux/amd64 cgo=${{ matrix.cgo }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        cgo: ["0", "1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.os }}-cgo${{ matrix.cgo }}-${{ hashFiles('go.mod') }}
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version
      # TestIsolation's open level tries to replace an iptables table and
      # wants the kernel's EPERM. Without the ip_tables module, which the
      # 26.04 runner doesn't load, the kernel answers ENOPROTOOPT before it
      # checks a capability, and the test fails saying so.
      - name: Load ip_tables
        run: sudo modprobe ip_tables
      # Ubuntu sets kernel.apparmor_restrict_unprivileged_userns=1, so
      # bubblewrap can make a user namespace only for a program with an
      # AppArmor profile that allows it. scripts/apparmor.sh loads the profile
      # the library prints for the test binary, and removes it after.
      - name: Show the restriction
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone
          ls /sys/kernel/security/apparmor/policy/profiles | grep -E 'bwrap|userns' || true
      # The 26.04 legs exist to test the profile against Ubuntu's bwrap
      # profile, so they fail if the runner stops loading it.
      - name: Require Ubuntu's bwrap profile
        if: matrix.os == 'ubuntu-26.04'
        run: |
          if ! ls -d /sys/kernel/security/apparmor/policy/profiles/bwrap.* >/dev/null 2>&1; then
            echo "Ubuntu's bwrap profile is not loaded, so this leg would not test the profile against it" >&2
            exit 1
          fi
      # SBX_LOCAL runs the tests on this machine, as the runner's own user, in
      # a directory of their own under /tmp, as the script explains. The cgo=0
      # leg runs every test twice in one process, so a test that leaves state
      # behind, or assumes it runs first, fails here. The cgo=1 leg runs every
      # test once under the race detector, which needs cgo on Linux, so the
      # suite runs once in each build without a third run of its own.
      - name: Test
        run: scripts/linux-test.sh -test.v -test.count=${{ matrix.cgo == '0' && '2' || '1' }} -test.timeout=${{ matrix.cgo == '0' && '15m' || '25m' }}
        env:
          SBX_LOCAL: "1"
          SBX_APPARMOR: "1"
          CGO: ${{ matrix.cgo }}
          RACE: ${{ matrix.cgo == '1' && '1' || '' }}
      # Without the profile no sandbox starts here. TestProbeVM checks that
      # Probe says so, and names the fix, rather than passing.
      - name: Probe without the profile
        run: scripts/linux-test.sh -test.v -test.run '^TestProbe'
        env:
          SBX_LOCAL: "1"
          CGO: ${{ matrix.cgo }}

  # The tests start real sandboxes with /usr/bin/sandbox-exec, as the runner's
  # own user, so they need no setup. A runner is not inside a Seatbelt profile,
  # which Probe would refuse.
  # The cgo=0 leg runs every test twice, and the cgo=1 leg runs every test
  # once under the race detector, as on Linux.
  #
  # Seatbelt's rules differ between releases: macOS 15 and 26 allowed a hard
  # link that 27 refuses (docs/findings.md). So each release a runner offers
  # is named here, rather than macos-latest, which moves without notice.
  macos:
    name: test ${{ matrix.os }} cgo=${{ matrix.cgo }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
        cgo: ["0", "1"]
    env:
      CGO_ENABLED: ${{ matrix.cgo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ matrix.os }}-cgo${{ matrix.cgo }}-${{ hashFiles('go.mod') }}
      - run: go build ./...
      - run: go vet ./...
      # The other architecture, which the runner cannot run but must build.
      - run: go vet ./...
        env:
          GOARCH: amd64
      # The cgo=0 leg runs every test twice in one process, so a test that
      # leaves state behind, or assumes it runs first, fails here.
      - name: Test
        if: matrix.cgo == '0'
        run: go test -v -count=2 -timeout 15m ./...
      - name: Test with the race detector
        if: matrix.cgo == '1'
        run: go test -race -count=1 -timeout 25m ./...
