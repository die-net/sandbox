name: golangci-lint

# Never add pull_request_target or workflow_run to any workflow here. They
# run with this repository's secrets and a token that can write, so a
# workflow that checks out or runs a pull request's code under them hands
# both to whoever wrote that code, including a fork's author.

on:
  pull_request:
  # A pull request can restore only its own caches and main's, so main
  # must run to save caches the next pull request can use.
  push:
    branches: [main]
  schedule:
    - cron: '49 4 20 * *'

permissions:
  contents: read

jobs:
  # Most of the code is in files built for one platform, so each is linted
  # with its own GOOS. Linting needs only type information, so linux runs
  # the darwin and windows passes too, without cgo.
  golangci:
    name: lint ${{ matrix.goos }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Its own cache, since the tests' builds share no key with this one.
      - id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-lint-${{ matrix.goos }}-${{ hashFiles('go.mod') }}
      # GOOS is set on this step only, so nothing that installs a tool for
      # the runner picks it up.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
        with:
          version: v2.15
